version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
    groups: { all: { patterns: ["*"] } }
    commit-message: { prefix: "Fix" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    commit-message: { prefix: "Fix" }
