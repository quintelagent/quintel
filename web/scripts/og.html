<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#06080B;overflow:hidden}
  body{font-family:Geist,sans-serif;color:#EAF2F8;position:relative}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(124,203,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(124,203,255,.06) 1px,transparent 1px);background-size:56px 56px}
  canvas{position:absolute;inset:0}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 25% 50%,rgba(6,8,11,.1),rgba(6,8,11,.9) 75%)}
  .c{position:absolute;left:72px;top:64px;right:72px}
  .logo{font-family:'Geist Mono';letter-spacing:.22em;font-size:22px;display:flex;align-items:center;gap:14px}
  h1{font-weight:500;font-size:84px;line-height:.98;letter-spacing:-.035em;margin:58px 0 0;max-width:12ch}
  h1 span{color:#7CCBFF}
  .sub{font-family:'Geist Mono';font-size:20px;letter-spacing:.08em;color:#8A99A8;margin-top:34px;text-transform:uppercase}
  .dot{width:9px;height:9px;border-radius:50%;background:#7CCBFF;box-shadow:0 0 14px #7CCBFF;display:inline-block;margin-right:12px}
  .foot{position:absolute;left:72px;bottom:52px;font-family:'Geist Mono';font-size:18px;color:#5A6878;letter-spacing:.06em}
</style></head><body>
<div class="grid"></div><canvas id="c" width="1200" height="630"></canvas><div class="vig"></div>
<div class="c">
  <div class="logo"><svg width="34" height="34" viewBox="0 0 64 64"><g fill="none" stroke-width="4" stroke-linecap="round"><path d="M8 40 C22 40 30 20 56 12" stroke="#7CCBFF"/><path d="M8 40 C24 40 34 31 56 28" stroke="#7CCBFF" opacity=".65"/><path d="M8 40 C24 41 36 45 56 50" stroke="#FF4D5E" opacity=".9"/></g><circle cx="8" cy="40" r="5" fill="#B8E6FF"/></svg>QUINTEL</div>
  <h1>1,000,000 futures for NVDA. <span>Every 10 minutes.</span></h1>
  <div class="sub"><span class="dot"></span>Scenario odds · AI research agent · verified on-chain</div>
</div>
<div class="foot">quintelagent.com · not financial advice</div>
<script>
// decorative fan (illustrative random walks — no data claims)
const c=document.getElementById('c').getContext('2d');let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
const n=(()=>{let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)});
c.globalCompositeOperation='lighter';
for(let p=0;p<520;p++){let y=300,x0=760;c.beginPath();c.moveTo(x0,y);let pts=[];for(let d=1;d<=21;d++){y+=n()*12;pts.push([x0+d*21,y])}
const tail=pts[20][1]>400;c.strokeStyle=tail?'rgba(255,77,94,.18)':'rgba(124,203,255,.075)';pts.forEach(q=>c.lineTo(q[0],q[1]));c.stroke()}
</script></body></html>
